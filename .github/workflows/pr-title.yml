name: PR Title

# This repository merges with squash only, and the squash commit subject is the
# PR title. release.yml decides the next version from those subjects, so keep
# PR titles in Conventional Commits form. A title outside this form is not
# counted at all: a fix merged as "Fix the index" would never be released.
# Not filtered by paths, so it can be made a required check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            test
            build
            ci
            style
            revert
          requireScope: false
