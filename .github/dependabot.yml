version: 2
updates:
  # Pushing to main runs semantic-release, which publishes to npm. A "fix(deps)"
  # prefix would turn every merged dependency update into a release, so use
  # "chore(deps)". yarn.lock is not part of the published package, so
  # transitive updates never reach users anyway. When a PR changes the ranges
  # in "dependencies" (glob, ignore, ora), retitle it to "fix(deps):" before
  # merging if it should be released.
  # open-pull-requests-limit: 0 keeps version updates off; security updates
  # still open PRs and use this prefix.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # Actions only run in CI, so updates never reach users.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
